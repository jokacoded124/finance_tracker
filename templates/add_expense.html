<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense · My Finances</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="My Finances">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>- Spending</h1>
        <a href="{{ url_for('home') }}" class="btn">← Back</a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form class="form-card" method="POST">
        <label for="amount">Amount (KSh)</label>
        <input type="number" step="0.01" min="0.01" id="amount" name="amount" required>

        <label for="category">Category</label>
        <select id="category" name="category" required>
            <option value="">-- Select category --</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Rent">Rent</option>
            <option value="Utilities">Utilities</option>
            <option value="Shopping">Shopping</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Health">Health</option>
            <option value="Other">Other</option>
        </select>

        <label for="description">Description (optional)</label>
        <input type="text" id="description" name="description">

        <label for="payment_method">Payment Method</label>
        <select id="payment_method" name="payment_method">
            <option value="M-Pesa">M-Pesa</option>
            <option value="Bank">Bank</option>
            <option value="Cash">Cash</option>
            <option value="Other">Other</option>
        </select>

        <label for="date">Date</label>
        <input type="date" id="date" name="date" value="{{ today }}" required>

        <button type="submit" class="btn btn-expense">Save Expense</button>
    </form>
</div>
</body>
</html>
