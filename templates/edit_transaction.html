<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction · My Finances</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Edit Transaction</h1>
        <a href="{{ url_for('home') }}" class="btn">← Back</a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form class="form-card" method="POST">
        <label for="amount">Amount (KSh)</label>
        <input
            type="number" step="0.01" min="0.01"
            id="amount" name="amount"
            value="{{ transaction['amount'] }}" required
        >

        <label for="category">Category</label>
        <input
            type="text" id="category" name="category"
            value="{{ transaction['category'] }}" required
        >

        <label for="description">Description</label>
        <input
            type="text" id="description" name="description"
            value="{{ transaction['description'] or '' }}"
        >

        <label for="payment_method">Payment Method</label>
        <input
            type="text" id="payment_method" name="payment_method"
            value="{{ transaction['payment_method'] or '' }}"
        >

        <label for="date">Date</label>
        <input
            type="date" id="date" name="date"
            value="{{ transaction['date'] }}" required
        >

        <button type="submit" class="btn btn-income">Save Changes</button>
    </form>
</div>
</body>
</html>
