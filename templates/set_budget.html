<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set Budget</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 5px;
        }

        .month {
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #198754;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #157347;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #198754;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Set Monthly Budget 💰</h1>

    <div class="month">
        {{ month_name }}
    </div>

    <form method="POST">

        <label for="amount">
            Budget Amount (KSh)
        </label>

        <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="0"
            placeholder="e.g. 30000"
            value="{{ budget.amount if budget else '' }}"
            required
        >

        <button type="submit">
            Save Budget
        </button>

    </form>

    <a href="{{ url_for('home') }}" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
